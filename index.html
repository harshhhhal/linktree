<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>harshhhhal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <meta name="google" content="notranslate">


    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    
    <style>
        /* --- 1. CORE VARIABLES --- */
        :root {
            /* Default Dark */
            --bg: #050505;
            --text: #ffffff;
            --text-sub: #9ca3af;
            --accent: #fa9702;

            /* Glassmorphism */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 20px;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);

            /* Profile */
            --profile-border: 2px dotted rgba(255, 255, 255, 0.3);

            /* Particles */
            --particle-color: rgba(255, 255, 255, 0.7);
            --line-opacity: 0.35;

            /* ANIMATION EASING - The Secret Sauce */
            /* Elastic bounce for "Pop in" effects */
            --ease-elastic: cubic-bezier(0.68, -0.6, 0.32, 1.6);
            /* Smooth acceleration for movement */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg: #e2e8f0;
            --text: #1a202c;
            --text-sub: #4a5568;
            --accent: #ea580c;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --profile-border: 2px dotted rgba(0, 0, 0, 0.3);
            --particle-color: rgba(0, 0, 0, 0.7);
            --line-opacity: 0.2;
        }

        /* View Transition for Theme Switch */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation: none;
            mix-blend-mode: normal;
        }

        ::view-transition-new(root) {
            z-index: 99999;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100dvh;
            overflow: hidden;
            /* Locked during intro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            scrollbar-gutter: stable;
        }

        /* --- 2. BACKGROUND LAYERS --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- 3. CUSTOM CURSOR --- */
        .cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100000;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease-out, height 0.15s ease-out, border-color 0.15s ease, opacity 0.3s ease;
            opacity: 0;
            will-change: transform;
        }

        body.mouse-moved .cursor-ring {
            opacity: 1;
        }

        body.hovering .cursor-ring {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        /* --- 4. INTRO ANIMATION LAYER (UPDATED) --- */
        #intro-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            perspective: 1000px;
        }

        .intro-h {
            font-size: 4rem;
            font-weight: 700;
            opacity: 0;
            position: absolute;
            transform: scale(0);
            /* Elastic Pop in */
            transition: transform 1s var(--ease-elastic), opacity 0.5s ease;
            will-change: transform;
        }

        .intro-circle-svg {
            position: absolute;
            width: 140px;
            height: 140px;
            /* Start slightly rotated */
            transform: rotate(-90deg) scale(0.8);
            opacity: 0;
            transition: transform 1s var(--ease-out-expo), opacity 0.5s ease;
        }

        .intro-circle-path {
            fill: none;
            stroke: var(--text);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* The Flying Logo */
        .flying-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: var(--profile-border);
            opacity: 0;
            /* START STATE: Small and rotated BACKWARDS (-180deg) */
            transform: translate(-50%, -50%) scale(0) rotate(-180deg);

            /* TRANSITION: Smooth spin into place */
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            will-change: transform;
        }

        /* --- 5. MAIN CARD --- */
        #main-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            opacity: 0;
        }

        .card.start-slam {
            animation: fadeInCard 0.5s ease forwards;
        }

        @keyframes fadeInCard {
            to {
                opacity: 1;
            }
        }

        /* Profile Inside Card */
        .profile-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: relative;
            z-index: 20;
            pointer-events: auto;
        }

        .profile-wrapper:active {
            transform: scale(0.95);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: var(--profile-border);
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.3s ease-out, filter 0.3s ease, border-color 0.3s ease;
            will-change: transform;
        }

        .profile-wrapper:hover .profile-img {
            transform: scale(1.05);
            border-color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* Content Reveals */
        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
        }

        .reveal-content h1 {
            animation: slideUp 0.4s ease forwards 0.1s;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
        }

        .reveal-content .social-grid {
            animation: slideUp 0.4s ease forwards 0.2s;
        }

        .btn-main {
            display: block;
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
        }

        .reveal-content .btn-main {
            animation: slideUp 0.4s ease forwards 0.3s;
        }

        .btn-main:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .social-icon svg {
            width: 20px;
            fill: var(--text-sub);
            transition: 0.3s;
        }

        .social-icon:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .social-icon:hover svg {
            fill: white;
        }

        body.scroll-active {
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .cursor-ring {
                display: none;
            }

            * {
                cursor: auto !important;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // --- 1. INTRO SEQUENCE ---
            const hLetter = document.querySelector('.intro-h');
            const circleSvg = document.querySelector('.intro-circle-svg');
            const circlePath = document.querySelector('.intro-circle-path');
            const flyingLogo = document.getElementById('flying-logo');

            const mainCard = document.getElementById('main-card');
            const finalLogoContainer = document.getElementById('theme-trigger');

            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const runAnimation = async () => {
                await wait(100);

                // 1. Elastic Pop-In of 'H'
                hLetter.style.opacity = '1';
                hLetter.style.transform = 'scale(1)';

                // 2. Start Circle draw slightly earlier for overlap
                await wait(300);
                circleSvg.style.opacity = '1';
                // Rotate the SVG while drawing for dynamic feel (0deg)
                circleSvg.style.transform = 'rotate(0deg) scale(1)';
                circlePath.style.strokeDashoffset = '0';

                // 3. WAIT - View
                await wait(1000);

                // 4. THE SWAP (Spin Out H -> Spin In Logo)

                // Spin H Away (Clockwise 180)
                hLetter.style.transition = 'transform 0.6s ease-in, opacity 0.4s';
                hLetter.style.transform = 'scale(0) rotate(180deg)';
                hLetter.style.opacity = '0';

                // Spin Circle Away
                circleSvg.style.transition = 'transform 0.6s ease-in, opacity 0.4s';
                circleSvg.style.transform = 'rotate(180deg) scale(0.2)';
                circleSvg.style.opacity = '0';

                // Logo Spins In (From -180 to 0)
                await wait(200);
                flyingLogo.style.opacity = '1';
                flyingLogo.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';

                await wait(800);

                // --- MOVEMENT TO CARD ---
                mainCard.style.transition = 'none';
                mainCard.style.opacity = '0';

                // Calculate Coords
                const finalRect = finalLogoContainer.getBoundingClientRect();
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const targetX = finalRect.left + (finalRect.width / 2);
                const targetY = finalRect.top + (finalRect.height / 2);

                // Move Logo
                flyingLogo.style.transition = 'transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                flyingLogo.style.transform = `translate(calc(-50% + ${targetX - centerX}px), calc(-50% + ${targetY - centerY}px)) scale(1)`;
                flyingLogo.style.boxShadow = 'none';

                await wait(400);

                mainCard.classList.add('start-slam');
                mainCard.classList.add('reveal-content');

                await wait(400);

                // Final Lock
                finalLogoContainer.style.transition = 'none';
                finalLogoContainer.style.opacity = '1';
                flyingLogo.style.display = 'none';

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        finalLogoContainer.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    }, 50);
                });

                document.body.classList.add('scroll-active');
                setTimeout(() => { document.getElementById('intro-layer').style.display = 'none'; }, 500);
            };
            runAnimation();

            // --- 2. MAGNETIC CURSOR & GLOBAL TRACKING ---
            const cursorRing = document.querySelector('.cursor-ring');
            let globalX = -100, globalY = -100;

            document.addEventListener('mousemove', (e) => {
                if (!document.body.classList.contains('mouse-moved')) document.body.classList.add('mouse-moved');
                globalX = e.clientX; globalY = e.clientY;
            });

            document.addEventListener('mouseleave', () => {
                document.body.classList.remove('mouse-moved');
                globalX = -500; globalY = -500;
            });

            // Independent Cursor Logic
            let rX = -100, rY = -100;
            const lerp = (s, e, f) => s + (e - s) * f;
            function renderCursor() {
                rX = lerp(rX, globalX, 0.35); rY = lerp(rY, globalY, 0.35);
                cursorRing.style.transform = `translate3d(${rX}px, ${rY}px, 0) translate(-50%, -50%)`;
                requestAnimationFrame(renderCursor);
            }
            renderCursor();

            document.querySelectorAll('[data-hover]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });

            // --- 3. THEME TOGGLE & PARTICLES ---
            const body = document.body;
            const themeTrigger = document.getElementById('theme-trigger');
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let parts = [];

            let strokeRGB = '255,255,255';
            let lineOpacity = 0.35;
            let particleColor = 'rgba(255,255,255,0.7)';

            function updateStyles() {
                const style = getComputedStyle(document.body);
                const pColor = style.getPropertyValue('--particle-color').trim();
                lineOpacity = parseFloat(style.getPropertyValue('--line-opacity').trim());
                strokeRGB = pColor.includes('255') ? '255,255,255' : '0,0,0';
                particleColor = pColor;
            }

            themeTrigger.addEventListener('click', () => {
                const toggle = () => {
                    body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
                    updateStyles();
                };

                if (!document.startViewTransition) { toggle(); return; }

                const rect = themeTrigger.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                const endRadius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

                document.startViewTransition(() => toggle()).ready.then(() => {
                    document.documentElement.animate(
                        { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`] },
                        { duration: 500, easing: "ease-out", pseudoElement: "::view-transition-new(root)" }
                    );
                });
            });

            // --- 4. REACTIVE CONSTELLATION ENGINE ---
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                updateStyles();
            }
            window.addEventListener('resize', () => { resize(); init(); });
            resize();

            class P {
                constructor() {
                    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                    this.s = Math.random() * 2;
                }
                u() {
                    this.x += this.vx; this.y += this.vy;

                    // Mouse Interaction
                    const dx = this.x - globalX;
                    const dy = this.y - globalY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const interactionRadius = 150;

                    if (dist < interactionRadius) {
                        const forceDirectionX = dx / dist;
                        const forceDirectionY = dy / dist;
                        const force = (interactionRadius - dist) / interactionRadius;
                        const repelStrength = 2; // Push away power
                        this.x += forceDirectionX * force * repelStrength;
                        this.y += forceDirectionY * force * repelStrength;
                    }

                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                d() {
                    ctx.fillStyle = particleColor;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2); ctx.fill();
                }
            }

            function init() { parts = Array.from({ length: innerWidth < 768 ? 60 : 110 }, () => new P()); }

            function anim() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                parts.forEach((p, i) => {
                    p.u(); p.d();

                    // Particle-to-Particle
                    for (let j = i; j < parts.length; j++) {
                        const dx = p.x - parts[j].x, dy = p.y - parts[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.strokeStyle = `rgba(${strokeRGB}, ${lineOpacity * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.6;
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(parts[j].x, parts[j].y); ctx.stroke();
                        }
                    }

                    // Particle-to-Mouse
                    const mDx = p.x - globalX;
                    const mDy = p.y - globalY;
                    const mDist = Math.sqrt(mDx * mDx + mDy * mDy);
                    if (mDist < 150 && globalX > 0) {
                        ctx.strokeStyle = `rgba(${strokeRGB}, ${lineOpacity * 1.5 * (1 - mDist / 150)})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(globalX, globalY); ctx.stroke();
                    }
                });
                requestAnimationFrame(anim);
            }
            init(); anim();
        });
    </script>
</body>

</html>
