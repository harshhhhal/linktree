    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
    <style>
        /* --- VARIABLES --- */
        :root {
            /* DARK MODE (Default) */
            --bg: #050505;
            
            /* Glass Properties */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.01) 100%);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 20px; 
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glass-inner-glow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            
            --text: #ffffff;
            --text-sub: #9ca3af;
            --accent: #fa9702;
            --particle-color: rgba(255, 255, 255, 0.5);
            --line-opacity: 0.15;
        }

        [data-theme="light"] {
            --bg: #e2e8f0;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-blur: 20px;
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --glass-inner-glow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            --text: #1a202c;
            --text-sub: #4a5568;
            --accent: #ea580c;
            --particle-color: rgba(0, 0, 0, 0.6);
            --line-opacity: 0.1;
        }

        /* --- VIEW TRANSITION --- */
        ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
        ::view-transition-new(root) { z-index: 9999; }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            /* Mobile Optimization: use dvh (Dynamic Viewport Height) */
            min-height: 100dvh;
            overflow-x: hidden; /* Prevent horizontal scroll */
            overflow-y: auto;   /* Allow scroll on short screens */
            
            display: flex;
            flex-direction: column; /* Stack Card then Button */
            justify-content: center;
            align-items: center;
            gap: 2rem; /* Space between card and button */
            padding: 20px; /* Safety padding for mobile edges */
            
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- SHUTTER INTRO --- */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000; pointer-events: none;
        }
        .shutter {
            position: absolute; left: 0; width: 100%; height: 50%;
            background: #000;
            transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1);
            will-change: transform;
        }
        .shutter-top { top: 0; transform-origin: top; }
        .shutter-bottom { bottom: 0; transform-origin: bottom; }
        .intro-finish .shutter-top { transform: translateY(-100%); }
        .intro-finish .shutter-bottom { transform: translateY(100%); }

        /* --- LAYERS --- */
        #bg-canvas { z-index: 0; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .card, .theme-toggle { z-index: 10; will-change: transform; }
        .cursor-ring { z-index: 9999; pointer-events: none; }

        /* --- GLASS CARD --- */
        .card {
            position: relative;
            width: 100%;
            max-width: 380px; /* Optimized for phones */
            padding: 2.5rem 1.5rem;
            text-align: center;
            border-radius: 24px;
            
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inner-glow);
            
            transition: box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
            
            opacity: 0;
            transform: scale(1.5) rotate(5deg);
        }

        .card.start-anim {
            animation: slamIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slamIn {
            0% { opacity: 0; transform: scale(1.5) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* --- CONTENT REVEALS --- */
        .reveal { opacity: 0; transform: translateY(20px); }
        .card.start-anim .reveal { animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .d-1 { animation-delay: 0.2s !important; } 
        .d-2 { animation-delay: 0.3s !important; } 
        .d-3 { animation-delay: 0.4s !important; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* --- THEME TOGGLE (UPDATED POSITION) --- */
        .theme-toggle {
            /* Removed absolute positioning */
            position: relative; 
            width: 50px; height: 50px;
            border-radius: 50%; 
            background: var(--glass-bg);
            border: 1px solid var(--glass-border); 
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            opacity: 0; 
            animation: fadeInSimple 0.5s ease 0.8s forwards;
            cursor: pointer !important;
        }
        @keyframes fadeInSimple { to { opacity: 1; } }

        .theme-toggle:hover { transform: scale(1.1); border-color: var(--accent); }
        .theme-icon { position: absolute; width: 24px; height: 24px; fill: var(--text); transition: 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        
        [data-theme="dark"] .sun-icon { transform: rotate(180deg) scale(0); opacity: 0; }
        [data-theme="dark"] .moon-icon { transform: rotate(0) scale(1); opacity: 1; }
        [data-theme="light"] .sun-icon { transform: rotate(0) scale(1); opacity: 1; }
        [data-theme="light"] .moon-icon { transform: rotate(-180deg) scale(0); opacity: 0; }

        /* --- CONTENT STYLES --- */
        .profile-wrapper { width: 120px; height: 120px; margin: 0 auto 2rem; position: relative; }
        .profile-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--glass-border); padding: 5px; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease;
        }
        .profile-wrapper:hover .profile-img { transform: scale(1.1); border-color: var(--accent); box-shadow: 0 0 25px var(--accent); }
        
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 2rem; }
        
        .social-grid { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .social-icon {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center; 
            transition: 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .social-icon svg { width: 20px; height: 20px; fill: var(--text-sub); transition: 0.2s; }
        .social-icon:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-5px); }
        .social-icon:hover svg { fill: white; }

        .btn-main {
            display: block; width: 100%; padding: 1rem;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-radius: 30px; color: var(--text); text-decoration: none; font-weight: 600;
            text-align: center; position: relative; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .btn-main::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); transition: 0.4s;
        }
        .btn-main:hover { transform: scale(1.02); border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .btn-main:hover::before { left: 100%; }
        
        /* --- CURSOR --- */
        .cursor-ring {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            border: 2px solid var(--text); border-radius: 50%;
            transition: width 0.15s ease-out, height 0.15s ease-out, border-color 0.15s ease;
            opacity: 0; will-change: transform;
        }
        body.mouse-moved .cursor-ring { opacity: 1; }
        body.hovering .cursor-ring {
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.1); border-color: var(--accent);
        }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 768px) { 
            .cursor-ring { display: none; } 
            * { cursor: auto !important; } 
            .card { padding: 2rem 1.25rem; }
            h1 { font-size: 1.75rem; }
        }
    </style>

    <script>
        // --- TIMELINE CONTROLLER ---
        const container = document.getElementById('intro-container');
        const mainCard = document.getElementById('main-card');

        window.addEventListener('load', () => {
            setTimeout(() => {
                container.classList.add('intro-finish');
                setTimeout(() => { mainCard.classList.add('start-anim'); }, 200);
            }, 500);
        });

        // --- FAST MAGNETIC CURSOR ---
        const cursorRing = document.querySelector('.cursor-ring');
        let mX = -100, mY = -100;
        let rX = -100, rY = -100;

        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('mouse-moved')) document.body.classList.add('mouse-moved');
            mX = e.clientX; mY = e.clientY;
        });

        const lerp = (s, e, f) => s + (e - s) * f;
        function renderCursor() {
            rX = lerp(rX, mX, 0.35); rY = lerp(rY, mY, 0.35);
            cursorRing.style.transform = `translate3d(${rX}px, ${rY}px, 0) translate(-50%, -50%)`;
            requestAnimationFrame(renderCursor);
        }
        renderCursor();

        document.querySelectorAll('[data-hover]').forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
        });

        // --- THEME FROM PROFILE CENTER ---
        const themeBtn = document.getElementById('theme-btn');
        const body = document.body;
        
        themeBtn.addEventListener('click', () => {
            const toggle = () => {
                body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            };
            if (!document.startViewTransition) { toggle(); return; }
            
            // CALCULATE CENTER OF PROFILE IMAGE
            const profileRect = document.querySelector('.profile-wrapper').getBoundingClientRect();
            const x = profileRect.left + profileRect.width / 2;
            const y = profileRect.top + profileRect.height / 2;
            
            const endRadius = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
            
            document.startViewTransition(() => toggle()).ready.then(() => {
                document.documentElement.animate(
                    { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`] },
                    { duration: 400, easing: "ease-out", pseudoElement: "::view-transition-new(root)" }
                );
            });
        });

        // --- PARTICLES ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', () => { resize(); init(); });
        resize();

        class P {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random()-0.5) * 0.4;
                this.vy = (Math.random()-0.5) * 0.4;
                this.s = Math.random() * 2;
            }
            u() {
                this.x += this.vx; this.y += this.vy;
                if (this.x<0||this.x>canvas.width) this.vx*=-1;
                if (this.y<0||this.y>canvas.height) this.vy*=-1;
            }
            d() {
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--particle-color');
                ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fill();
            }
        }
        function init() { parts = Array.from({length: innerWidth<768?40:80}, () => new P()); }
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const style = getComputedStyle(document.body);
            const pColor = style.getPropertyValue('--particle-color').trim();
            const opacity = style.getPropertyValue('--line-opacity').trim();
            const strokeRGB = pColor.includes('255') ? '255,255,255' : '0,0,0';
            parts.forEach((p,i) => {
                p.u(); p.d();
                for(let j=i; j<parts.length; j++) {
                    const dx = p.x - parts[j].x, dy = p.y - parts[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 100) {
                        ctx.strokeStyle = `rgba(${strokeRGB}, ${opacity * (1-dist/100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(parts[j].x, parts[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(anim);
        }
        init(); anim();
    </script>
